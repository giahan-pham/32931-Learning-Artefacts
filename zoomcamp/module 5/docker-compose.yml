volumes:
  grafana_data: {}

networks:
  front-tier:
  back-tier:

services:
  # PostgreSQL database that stores the daily metrics
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    networks:
      - back-tier

  # Web page to look inside the database: http://localhost:8080
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - back-tier
      - front-tier

  # Dashboards: http://localhost:3000 (login admin / admin)
  grafana:
    image: grafana/grafana-enterprise:11.3.0
    user: "472"
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/opt/grafana/dashboards
    networks:
      - back-tier
      - front-tier
    restart: always
